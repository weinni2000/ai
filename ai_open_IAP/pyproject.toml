[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-ai-proxy"
version = "0.1.0"
description = "Small Odoo AI endpoint proxy for OpenAI-compatible inference servers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "psycopg2-binary>=2.9",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
addopts = "-p no:odoo"
testpaths = ["tests"]
pythonpath = ["."]
